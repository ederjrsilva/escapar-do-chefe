<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escapar do Chefe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lobby" class="screen">
        <h1>Escapar do Chefe</h1>
        <p>Digite seu nome e selecione sua foto de perfil para iniciar:</p>
        
        <input type="text" id="playerName" placeholder="Seu Nome" maxlength="15" autocomplete="off">
        
        <div class="photo-container">
            <p>Escolha sua foto (Obrigatório):</p>
            <div class="photo-grid">
                <img src="fotos/foto1.jpg" alt="Foto 1" class="photo-option" data-photo="fotos/foto1.jpg">
                <img src="fotos/foto2.jpg" alt="Foto 2" class="photo-option" data-photo="fotos/foto2.jpg">
                <img src="fotos/foto3.jpeg" alt="Foto 3" class="photo-option" data-photo="fotos/foto3.jpeg">
                <img src="fotos/foto4.jpg" alt="Foto 4" class="photo-option" data-photo="fotos/foto4.jpg">
                <img src="fotos/foto5.jpg" alt="Foto 5" class="photo-option" data-photo="fotos/foto5.jpg">
                <img src="fotos/foto6.jpg" alt="Foto 6" class="photo-option" data-photo="fotos/foto6.jpg">
            </div>
        </div>

        <button id="startButton" disabled>Entrar no Jogo</button>
        <p id="error-msg" class="error-hidden">Por favor, selecione uma foto antes de iniciar!</p>
    </div>

    <div id="game-container" class="screen hidden">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="game-ui">
            <span>Use W, A, S, D ou Setas para mover. Fuga do Chefe!</span>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
