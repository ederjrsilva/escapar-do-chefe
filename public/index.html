<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Hospital Escape</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Roboto', sans-serif; color: #fff; }
        .screen { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; flex-direction: column; align-items: center; justify-content: center; }
        .screen.active { display: flex; }
        #lobby { background: #0f172a; }
        #lobby-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 800px; margin: 20px; }
        .player-card { background: #1e293b; padding: 15px; border-radius: 8px; text-align: center; width: 180px; border: 2px solid transparent; }
        .player-card.ready { border-color: #4caf50; }
        .player-card.me { box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
        .avatar-img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin: 10px auto; border: 2px solid #fff; cursor: pointer; display: block; }
        
        #photo-modal { display: none; position: fixed; top: 10%; left: 50%; transform: translateX(-50%); background: #1e293b; padding: 20px; border: 2px solid #475569; border-radius: 10px; z-index: 100; max-width: 500px; text-align: center; }
        .photo-option { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 5px; cursor: pointer; border: 2px solid transparent; }
        .photo-option:hover { border-color: #38bdf8; }

        button { padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; background: #38bdf8; color: #000; transition: 0.2s; }
        button:hover { background: #0284c7; color: #fff; }
        
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; }
        #hud.hidden { display: none; }
        .hud-top, .hud-bottom { display: flex; justify-content: space-between; padding: 20px; }
        .hud-box { background: rgba(15, 23, 42, 0.8); border: 2px solid #334155; padding: 15px; border-radius: 8px; pointer-events: auto; }
        #objective-text { color: #facc15; font-weight: bold; font-size: 18px; margin-top: 5px; }
        #minimap-container { width: 150px; height: 150px; background: rgba(0,0,0,0.5); border: 2px solid #475569; position: relative; }
        .status-bar-container { display: flex; flex-direction: column; gap: 10px; width: 250px; }
        .bar-wrap { background: #1e293b; height: 20px; border-radius: 10px; overflow: hidden; border: 1px solid #475569; position: relative; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.1s; }
        #stamina-fill { background: #38bdf8; }
        #noise-fill { background: #ef4444; width: 0%; }
        .bar-label { position: absolute; top: 2px; left: 10px; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        #hud-alert { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); text-align: center; color: #ef4444; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 5px #000; }
        #spectator-banner { position: absolute; top: 0; left: 0; width: 100%; text-align: center; padding: 10px; background: rgba(0,0,0,0.6); color: #facc15; font-weight: bold; letter-spacing: 2px; pointer-events: none; }
        .hidden { display: none !important; }

        /* Controles de toque (mobile) — ficam fixos na parte de baixo da tela,
           semi-transparentes, e só aparecem em telas de toque durante a partida. */
        body.mobile-mode .hud-bottom { margin-bottom: 135px; }
        #mobile-controls {
            position: fixed; left: 0; right: 0; bottom: 0; height: 175px;
            display: flex; justify-content: space-between; align-items: flex-end;
            padding: 0 18px 18px; box-sizing: border-box;
            pointer-events: none; z-index: 50;
        }
        #dpad { position: relative; width: 132px; height: 132px; pointer-events: auto; }
        .dpad-btn {
            position: absolute; width: 46px; height: 46px; border-radius: 10px;
            background: rgba(15,23,42,0.55); border: 2px solid rgba(255,255,255,0.35);
            color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; padding: 0;
        }
        .dpad-btn.active-btn { background: rgba(56,189,248,0.6); border-color: #38bdf8; }
        .dpad-up { top: 0; left: 43px; }
        .dpad-down { top: 86px; left: 43px; }
        .dpad-left { top: 43px; left: 0; }
        .dpad-right { top: 43px; left: 86px; }

        #action-buttons { display: flex; gap: 14px; align-items: flex-end; pointer-events: auto; }
        .action-btn {
            width: 62px; height: 62px; border-radius: 50%;
            background: rgba(15,23,42,0.55); border: 2px solid rgba(255,255,255,0.35);
            color: #fff; font-size: 10px; font-weight: bold; line-height: 1.2;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; padding: 0;
        }
        .action-btn span { font-size: 18px; }
        #btn-run.active-btn { background: rgba(56,189,248,0.6); border-color: #38bdf8; }
        #btn-hide.active-btn { background: rgba(250,204,21,0.6); border-color: #facc15; }
    </style>
</head>
<body>
    <div id="lobby" class="screen active">
        <h1>🏥 HOSPITAL ESCAPE</h1>
        <div id="lobby-grid"></div>
        <button id="btn-start" style="margin-top:20px;">Aguardando jogadores...</button>
    </div>

    <!-- Modal para selecionar foto -->
    <div id="photo-modal">
        <h3>Escolha seu rosto</h3>
        <div id="photo-list" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;"></div>
        <button onclick="document.getElementById('photo-modal').style.display='none'" style="margin-top:15px;">Fechar</button>
    </div>

    <div id="hud" class="hidden">
        <div class="hud-top">
            <div class="hud-box">
                <div>OBJETIVO ATUAL:</div><div id="objective-text">Aguardando...</div>
                <div style="font-size: 12px; color:#94a3b8; margin-top:5px;" id="hud-time">Tempo: 00:00</div>
            </div>
            <div id="minimap-container"><canvas id="minimapCanvas" width="150" height="150"></canvas></div>
        </div>
        <div class="hud-bottom">
            <div class="hud-box status-bar-container">
                <div class="bar-wrap"><div class="bar-fill" id="stamina-fill"></div><div class="bar-label">ENERGIA (Shift)</div></div>
                <div class="bar-wrap"><div class="bar-fill" id="noise-fill"></div><div class="bar-label">RUÍDO (Ctrl)</div></div>
            </div>
            <div class="hud-box"><div>SOBREVIVENTES: <span id="alive-count">0</span></div></div>
        </div>
        <div id="hud-alert" class="hidden"><span id="alert-text"></span></div>
        <div id="spectator-banner" class="hidden">👁 MODO ESPECTADOR — aguardando o fim da partida...</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="mobile-controls" class="hidden">
        <div id="dpad">
            <button id="btn-up" class="dpad-btn dpad-up">▲</button>
            <button id="btn-left" class="dpad-btn dpad-left">◀</button>
            <button id="btn-right" class="dpad-btn dpad-right">▶</button>
            <button id="btn-down" class="dpad-btn dpad-down">▼</button>
        </div>
        <div id="action-buttons">
            <button id="btn-hide" class="action-btn"><span>🙈</span>Esconder</button>
            <button id="btn-run" class="action-btn"><span>🏃</span>Correr</button>
            <button id="btn-interact" class="action-btn"><span>✋</span>Ação</button>
        </div>
    </div>
    
    <div id="game-over" class="screen">
        <h1 id="end-title"></h1><p id="end-msg"></p>
        <p style="font-size:13px; color:#94a3b8;">Reiniciando automaticamente em instantes...</p>
        <button onclick="location.reload()">Voltar ao Lobby agora</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
